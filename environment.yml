name: degap_env
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/bioconda
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - defaults
dependencies:
  - python=3.10
  - biopython
  - pysam
  - numpy
  - matplotlib
  - scipy
  # rammap is not packaged on conda/bioconda; build from source and put it on PATH:
  #   git clone https://github.com/jwanglab/rammap && cd rammap && cargo build --release
  #   cp target/release/rammap <somewhere on PATH>
  - hifiasm=0.25.0
  - samtools=1.22.1
  - seqkit=2.8.0
  - mummer4
  - parallel
  - ripgrep=15.1.0